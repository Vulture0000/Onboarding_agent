services:
  backend:
    build: ./backend
    container_name: onboard-ai-backend
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite:///./data/onboarding.db
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:8080
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: onboard-ai-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
